<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Learning Guide | HKDSE</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@2.3.6/dist/purify.min.js"></script>
    
    <style>
    /* 這是你喜歡的 Tech/Dark 風格 CSS */
    :root{--sidebar-width:280px}body[data-theme=dark]{--bg-color:#121418;--sidebar-color:#1a1d24;--chat-bg-color:#16181d;--secondary-color:#2a3b4f;--accent-color:#4a90e2;--text-color:#e0e0e0;--subtle-text-color:#8899a6;--border-color:#2a2d34;--input-bg-color:#2a2d34;--hover-bg-color:#252830;--ai-message-bg:#2a2d34;--code-bg-color:#101216;--modal-overlay-color:rgba(0,0,0,.7)}body[data-theme=light]{--bg-color:#f0f2f5;--sidebar-color:#fff;--chat-bg-color:#f7f8fa;--secondary-color:#e4e6eb;--accent-color:#1877f2;--text-color:#1c1e21;--subtle-text-color:#65676b;--border-color:#ced0d4;--input-bg-color:#e4e6eb;--hover-bg-color:#f0f2f5;--ai-message-bg:#e4e6eb;--code-bg-color:#eef0f2;--modal-overlay-color:rgba(0,0,0,.6)}*{box-sizing:border-box;margin:0;padding:0}html,body{height:100%;overflow:hidden}body{font-family:'Noto Sans','Segoe UI',Roboto,sans-serif;background-color:var(--bg-color);color:var(--text-color);transition:background-color .3s,color .3s}#app-container{display:flex;height:100dvh}#sidebar{width:var(--sidebar-width);background-color:var(--sidebar-color);display:flex;flex-direction:column;border-right:1px solid var(--border-color);transition:transform .3s ease,background-color .3s;flex-shrink:0}.sidebar-header{padding:1rem 1.25rem;border-bottom:1px solid var(--border-color)}#new-chat-btn{width:100%;padding:.75rem;background-color:transparent;border:1px solid var(--accent-color);color:var(--accent-color);border-radius:8px;font-size:.9rem;font-weight:500;cursor:pointer;transition:background-color .2s,color .2s}#new-chat-btn:hover{background-color:var(--accent-color);color:#fff}#history-list{flex-grow:1;list-style:none;overflow-y:auto;padding:.5rem}.history-item{display:flex;align-items:center;justify-content:space-between;padding:.75rem 1rem;margin:.25rem;border-radius:6px;cursor:pointer;color:var(--subtle-text-color);transition:background-color .2s,color .2s}.history-item-title{flex-grow:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.history-item:hover{background-color:var(--hover-bg-color);color:var(--text-color)}.history-item.active{background-color:var(--secondary-color);color:var(--text-color);font-weight:500}.sidebar-footer{padding:1rem 1.25rem;border-top:1px solid var(--border-color);display:flex;align-items:center;justify-content:space-between;gap:.5rem}#user-profile{display:flex;align-items:center;gap:.75rem;cursor:pointer;background-color:transparent;border:none;padding:.25rem;border-radius:6px;flex-grow:1;text-align:left;transition:background-color .2s;min-width:0}#user-profile:hover{background-color:var(--hover-bg-color)}.profile-avatar{width:32px;height:32px;border-radius:50%;object-fit:cover;flex-shrink:0;background-color:var(--secondary-color)}.profile-name{color:var(--text-color);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}#settings-btn{background:0 0;border:none;cursor:pointer;padding:.5rem;flex-shrink:0}#settings-btn svg{width:20px;height:20px;fill:var(--subtle-text-color);transition:fill .2s}#settings-btn:hover svg{fill:var(--text-color)}#chat-container{flex-grow:1;display:flex;flex-direction:column;height:100dvh;background-color:var(--chat-bg-color)}.chat-header{display:none;padding:1rem;border-bottom:1px solid var(--border-color)}#menu-btn{background:0 0;border:none;cursor:pointer}#menu-btn svg{width:24px;height:24px;fill:var(--text-color)}#chat-history{flex-grow:1;overflow-y:auto;padding:1.5rem;display:flex;flex-direction:column;gap:1.5rem}.message-wrapper{display:flex;align-items:flex-end;gap:10px;max-width:85%;animation:fadeIn .3s ease forwards;opacity:0;transform:translateY(10px);position:relative}.message-wrapper:hover .message-actions{opacity:1}@keyframes fadeIn{to{opacity:1;transform:translateY(0)}}.chat-avatar{width:32px;height:32px;border-radius:50%;flex-shrink:0;background-color:var(--secondary-color)}.message-content{display:flex;flex-direction:column;width:100%}.message{padding:.75rem 1.25rem;border-radius:20px;line-height:1.6;word-wrap:break-word}.user-message-wrapper{align-self:flex-end;flex-direction:row-reverse}.user-message-wrapper .message{background-image:linear-gradient(to right,#4a90e2,#2a6db7);color:#fff;border-bottom-right-radius:6px}.ai-message-wrapper{align-self:flex-start}.ai-message-wrapper .message{background-color:var(--ai-message-bg);border-bottom-left-radius:6px}.ai-message-wrapper .message pre{white-space:pre-wrap;word-wrap:break-word;background-color:var(--code-bg-color);color:var(--text-color);padding:1rem;border-radius:8px;margin:1em 0;font-family:'Courier New',Courier,monospace;font-size:.9rem;border:1px solid var(--border-color)}.ai-message-wrapper .message code{background-color:var(--code-bg-color);padding:.2em .4em;margin:0;font-size:85%;border-radius:3px}.ai-message-wrapper .message pre code{background-color:transparent;padding:0;margin:0;font-size:inherit;border-radius:0}#input-area{flex-shrink:0;padding:1rem 1.5rem;border-top:1px solid var(--border-color);background-color:var(--chat-bg-color);display:flex;align-items:flex-end;gap:.75rem}#input-area textarea{flex-grow:1;background-color:var(--input-bg-color);border:1px solid var(--border-color);color:var(--text-color);border-radius:24px;padding:.75rem 1.25rem;font-family:inherit;font-size:1rem;resize:none;max-height:150px;line-height:1.5;transition:border-color .2s ease}#input-area textarea:focus{outline:0;border-color:var(--accent-color)}#input-area button{background-color:var(--accent-color);border:none;color:#fff;border-radius:50%;cursor:pointer;transition:background-color .2s ease;width:48px;height:48px;flex-shrink:0;display:flex;align-items:center;justify-content:center}#input-area button:hover{opacity:.8}#input-area button svg{width:24px;height:24px;fill:#fff}.modal{position:fixed;inset:0;background-color:var(--modal-overlay-color);display:flex;justify-content:center;align-items:center;opacity:0;visibility:hidden;transition:opacity .3s,visibility .3s;z-index:1000}.modal.visible{opacity:1;visibility:visible}.modal-content{background-color:var(--sidebar-color);padding:2rem;border-radius:12px;width:90%;max-width:450px;border:1px solid var(--border-color);transform:scale(.95);transition:transform .3s}.modal.visible .modal-content{transform:scale(1)}.modal-content h2{margin-bottom:1.5rem;text-align:center;font-weight:500}.setting-group{margin-bottom:1.25rem}.setting-group label{display:block;margin-bottom:.5rem;color:var(--subtle-text-color);font-size:.9rem}.setting-group input,.setting-group select,.setting-group textarea{width:100%;background-color:var(--input-bg-color);border:1px solid var(--border-color);color:var(--text-color);padding:.75rem;border-radius:8px;font-size:1rem}.modal-actions{text-align:right;margin-top:2rem}.modal-actions button{padding:.75rem 1.5rem;background-color:var(--accent-color);border:none;color:#fff;border-radius:8px;cursor:pointer;font-weight:500}.theme-toggle{display:flex;justify-content:space-between;align-items:center}#theme-toggle-btn{background:var(--input-bg-color);border:1px solid var(--border-color);border-radius:20px;padding:4px;cursor:pointer;display:flex}#theme-toggle-btn svg{width:20px;height:20px;fill:var(--subtle-text-color)}body[data-theme=light] #theme-toggle-btn .icon-light,#theme-toggle-btn .icon-dark{display:none}body[data-theme=dark] #theme-toggle-btn .icon-dark,body[data-theme=light] #theme-toggle-btn .icon-light{display:block}@media (max-width:768px){#sidebar{position:absolute;left:0;top:0;height:100%;transform:translateX(-100%);z-index:100}#sidebar.open{transform:translateX(0);box-shadow:10px 0 30px rgba(0,0,0,.5)}.chat-header{display:flex}#app-container.menu-open #chat-container{filter:blur(4px);pointer-events:none}}
    </style>
</head>
<body data-theme="dark">
    <div id="app-container">
        <aside id="sidebar">
            <div class="sidebar-header">
                <button id="new-chat-btn">＋ New Chat</button>
            </div>
            <ul id="history-list"></ul>
            <div class="sidebar-footer">
                <button id="user-profile">
                    <img id="profile-avatar" src="https://api.dicebear.com/9.x/notionists/svg?seed=Felix" alt="User" class="profile-avatar">
                    <span id="profile-name" class="profile-name">HKDSE Student</span>
                </button>
                <button id="settings-btn" title="Settings">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20"><path d="M10 8.33c.92 0 1.67.75 1.67 1.67s-.75 1.67-1.67 1.67S8.33 10.92 8.33 10 9.08 8.33 10 8.33zM18.34 11.1v-2.2l-2.06-.59a6.03 6.03 0 00-.73-1.35l.93-1.92-1.55-1.55-.1.1-1.82.98a6.01 6.01 0 00-1.35-.73L11.1 1.66h-2.2l-.59 2.06a6.03 6.03 0 00-1.35.73l-1.92-.93-1.55 1.55.98 1.82c-.27.42-.46.88-.73 1.35L1.66 8.9v2.2l2.06.59c.27.47.46.93.73 1.35l-.93 1.92 1.55 1.55.1-.1 1.82-.98c.42.27.88.46 1.35.73l.59 2.06h2.2l-.59-2.06c.47-.27.93-.46 1.35-.73l1.92.93 1.55-1.55-.98-1.82c.27-.42.46-.88.73-1.35l2.06-.59zM10 13.33a3.33 3.33 0 110-6.66 3.33 3.33 0 010 6.66z"/></svg>
                </button>
            </div>
        </aside>
        
        <main id="chat-container">
            <div class="chat-header">
                <button id="menu-btn" title="Open Menu">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg>
                </button>
            </div>
            <div id="chat-history"></div>
            <div id="input-area">
                <textarea id="user-input" placeholder="問下 DSE 嘢 (Maths, Physics, etc)..." rows="1"></textarea>
                <button id="send-btn" title="Send">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
                </button>
            </div>
        </main>
    </div>

    <!-- Settings Modal -->
    <div id="settings-modal" class="modal">
        <div class="modal-content">
            <h2>Settings</h2>
            <div class="setting-group">
                <label for="model-select">AI Model</label>
                <select id="model-select">
                    <option value="gemini-3-pro-preview" selected>Gemini 3 Pro (Preview)</option>
                    <option value="gemini-2.0-flash">Gemini 2.0 Flash</option>
                </select>
            </div>
            <div class="setting-group theme-toggle">
                <label>Color Mode</label>
                <button id="theme-toggle-btn">
                    <svg class="icon-light" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zM2 13h2c.55 0 1-.45 1-1s-.45-1-1-1H2c-.55 0-1 .45-1 1s.45 1 1 1zm18 0h2c.55 0 1-.45 1-1s-.45-1-1-1h-2c-.55 0-1 .45-1 1s.45 1 1 1zM11 2v2c0 .55.45 1 1 1s1-.45 1-1V2c0-.55-.45-1-1-1s-1 .45-1 1zm0 18v2c0 .55.45 1 1 1s1-.45 1-1v-2c0-.55-.45-1-1-1s-1 .45-1 1z"/></svg>
                    <svg class="icon-dark" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M12 3c-4.97 0-9 4.03-9 9s4.03 9 9 9 9-4.03 9-9c0-4.97-4.03-9-9-9zM12 19c-3.86 0-7-3.14-7-7s3.14-7 7-7 7 3.14 7 7-3.14 7-7 7z"/></svg>
                </button>
            </div>
            <div class="modal-actions">
                <button id="close-settings-btn">Done</button>
            </div>
        </div>
    </div>

    <script>
    // --- Setup & LocalStorage Management ---
    const AI_AVATAR_URL = `data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%238899a6'%3E%3Cpath d='M12 2a10 10 0 00-9.95 9.1c-.04.55.39 1 .95.95A10 10 0 0012 22a10 10 0 0010-10c0-5.52-4.48-10-10-10zm0 18a8 8 0 110-16 8 8 0 010 16zm-2-8a2 2 0 100-4 2 2 0 000 4zm4 0a2 2 0 100-4 2 2 0 000 4z'/%3E%3C/svg%3E`;
    
    // 從 LocalStorage 攞 History，如果無就開個新 Object
    let chatHistories = JSON.parse(localStorage.getItem('hkdse_chats')) || {};
    let activeChatId = null;

    // DOM Elements
    const chatHistoryUI = document.getElementById('chat-history');
    const userInput = document.getElementById('user-input');
    const sendBtn = document.getElementById('send-btn');
    const historyListUI = document.getElementById('history-list');
    const modelSelect = document.getElementById('model-select');
    const sidebar = document.getElementById('sidebar');

    function saveToLocalStorage() {
        localStorage.setItem('hkdse_chats', JSON.stringify(chatHistories));
    }

    // --- Core Functions ---
    function initialize() {
        // Theme
        const savedTheme = localStorage.getItem('theme') || 'dark';
        document.body.dataset.theme = savedTheme;
        
        // Render List
        renderHistoryList();
        
        // Load latest chat or create new
        const chatIds = Object.keys(chatHistories);
        if (chatIds.length > 0) {
            loadChat(chatIds[chatIds.length - 1]);
        } else {
            createNewChat();
        }
    }

    function createNewChat() {
        const newId = Date.now().toString();
        chatHistories[newId] = { 
            title: 'New Chat', 
            messages: [] 
        };
        saveToLocalStorage();
        renderHistoryList();
        loadChat(newId);
        // Mobile: close sidebar
        if(window.innerWidth <= 768) sidebar.classList.remove('open');
    }

    function loadChat(chatId) {
        activeChatId = chatId;
        const chat = chatHistories[chatId];
        renderMessages(chat.messages);
        
        // Highlight active
        document.querySelectorAll('.history-item').forEach(el => {
            el.classList.remove('active');
            if (el.dataset.chatId === chatId) el.classList.add('active');
        });
    }

    function renderHistoryList() {
        historyListUI.innerHTML = '';
        Object.keys(chatHistories).sort((a,b) => b-a).forEach(chatId => {
            const li = document.createElement('li');
            li.className = 'history-item';
            li.dataset.chatId = chatId;
            li.innerHTML = `<span class="history-item-title">${chatHistories[chatId].title}</span>`;
            if(chatId === activeChatId) li.classList.add('active');
            li.onclick = () => loadChat(chatId);
            historyListUI.appendChild(li);
        });
    }

    function renderMessages(messages) {
        chatHistoryUI.innerHTML = '';
        if (messages.length === 0) {
            addMessageToUI('assistant', "你好！我係你嘅 DSE 助手。今日想溫咩？<br>我可以解釋 Concept、出 Mock Question 或者幫你睇作文思路。");
        } else {
            messages.forEach(msg => addMessageToUI(msg.role, msg.content));
        }
        chatHistoryUI.scrollTop = chatHistoryUI.scrollHeight;
    }

    function addMessageToUI(role, content) {
        const wrapper = document.createElement('div');
        wrapper.className = `message-wrapper ${role === 'user' ? 'user' : 'ai'}-message-wrapper`;
        
        const avatar = document.createElement('img');
        avatar.className = 'chat-avatar';
        avatar.src = role === 'user' ? "https://api.dicebear.com/9.x/notionists/svg?seed=Felix" : AI_AVATAR_URL;
        
        const messageDiv = document.createElement('div');
        messageDiv.className = 'message';
        // Parse Markdown
        messageDiv.innerHTML = DOMPurify.sanitize(marked.parse(content));
        
        if (role === 'user') {
            wrapper.appendChild(messageDiv);
            wrapper.appendChild(avatar); // User avatar on right
        } else {
            wrapper.appendChild(avatar); // AI avatar on left
            wrapper.appendChild(messageDiv);
        }
        
        chatHistoryUI.appendChild(wrapper);
        chatHistoryUI.scrollTop = chatHistoryUI.scrollHeight;
    }

    async function handleSendMessage() {
        const text = userInput.value.trim();
        if (!text) return;

        // 1. Add User Message
        const currentChat = chatHistories[activeChatId];
        currentChat.messages.push({ role: 'user', content: text });
        addMessageToUI('user', text);
        
        // Update Title if it's the first message
        if (currentChat.messages.length === 1) {
            currentChat.title = text.substring(0, 20) + '...';
            renderHistoryList();
        }
        saveToLocalStorage();

        userInput.value = '';
        userInput.style.height = 'auto';
        sendBtn.disabled = true;

        // 2. Loading State
        const loadingDiv = document.createElement('div');
        loadingDiv.className = 'message-wrapper ai-message-wrapper';
        loadingDiv.innerHTML = `<img class="chat-avatar" src="${AI_AVATAR_URL}"><div class="message">Gemini 思考中...</div>`;
        chatHistoryUI.appendChild(loadingDiv);
        chatHistoryUI.scrollTop = chatHistoryUI.scrollHeight;

        try {
            // 3. Call Vercel API
            const response = await fetch('/api/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    messages: currentChat.messages,
                    model: modelSelect.value
                })
            });

            const data = await response.json();
            
            // Remove Loading
            chatHistoryUI.removeChild(loadingDiv);

            if (response.ok) {
                const aiContent = data.content;
                currentChat.messages.push({ role: 'assistant', content: aiContent });
                addMessageToUI('assistant', aiContent);
                saveToLocalStorage();
            } else {
                addMessageToUI('assistant', "出錯： " + (data.error || "網絡問題"));
            }

        } catch (e) {
            chatHistoryUI.removeChild(loadingDiv);
            addMessageToUI('assistant', "網絡連接失敗，請檢查連線。");
        } finally {
            sendBtn.disabled = false;
        }
    }

    // --- Event Listeners ---
    document.addEventListener('DOMContentLoaded', initialize);
    
    sendBtn.addEventListener('click', handleSendMessage);
    userInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            handleSendMessage();
        }
    });

    document.getElementById('new-chat-btn').addEventListener('click', createNewChat);

    // Sidebar Toggle (Mobile)
    const menuBtn = document.getElementById('menu-btn');
    menuBtn.addEventListener('click', () => {
        sidebar.classList.add('open');
        document.getElementById('app-container').classList.add('menu-open');
    });

    // Close Sidebar when clicking outside
    document.addEventListener('click', (e) => {
        if (window.innerWidth <= 768 && 
            !sidebar.contains(e.target) && 
            !menuBtn.contains(e.target) && 
            sidebar.classList.contains('open')) {
            sidebar.classList.remove('open');
            document.getElementById('app-container').classList.remove('menu-open');
        }
    });

    // Settings Modal
    const settingsBtn = document.getElementById('settings-btn');
    const settingsModal = document.getElementById('settings-modal');
    const closeSettingsBtn = document.getElementById('close-settings-btn');
    const themeToggleBtn = document.getElementById('theme-toggle-btn');

    settingsBtn.addEventListener('click', () => settingsModal.classList.add('visible'));
    closeSettingsBtn.addEventListener('click', () => settingsModal.classList.remove('visible'));
    
    themeToggleBtn.addEventListener('click', () => {
        const newTheme = document.body.dataset.theme === 'dark' ? 'light' : 'dark';
        document.body.dataset.theme = newTheme;
        localStorage.setItem('theme', newTheme);
    });

    // Auto-resize textarea
    userInput.addEventListener('input', function() {
        this.style.height = 'auto';
        this.style.height = (this.scrollHeight) + 'px';
        if(this.value === '') this.style.height = 'auto';
    });

    </script>
</body>
</html>
